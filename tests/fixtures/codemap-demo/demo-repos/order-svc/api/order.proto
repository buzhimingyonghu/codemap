syntax = "proto3";

package order;

service OrderService {
  rpc CreateOrder(CreateOrderReq) returns (CreateOrderResp);
}

message Item {
  int64 sku_id = 1;
  int32 qty = 2;
}

message CreateOrderReq {
  int64 user_id = 1;
  repeated Item items = 2;
  int64 addr_id = 3;
}

message CreateOrderResp {
  int64 order_id = 1;
  int64 pay_amount = 2;
  int64 expire_at = 3;
}
