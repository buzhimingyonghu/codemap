<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      /* macOS icon grid: 824px rounded square centered on a 1024px canvas. */
      .tile {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 824px;
        height: 824px;
        border-radius: 185px;
        background: radial-gradient(120% 120% at 20% 10%, #262a33 0%, #14161b 55%, #0d0e12 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.08),
          inset 0 -2px 0 rgba(0, 0, 0, 0.4),
          0 24px 48px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 60% at 70% 75%, rgba(45, 212, 191, 0.16), transparent 70%);
      }
      .mark {
        position: absolute;
        left: 212px;
        top: 212px;
        width: 400px;
        height: 400px;
        border-radius: 96px;
        background: linear-gradient(135deg, #2dd4bf 0%, #5eead4 35%, #f59e8b 100%);
        box-shadow: 0 18px 40px rgba(45, 212, 191, 0.28);
      }
      .slash {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 520px;
        background: #14161b;
        border-radius: 22px;
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .caret {
        position: absolute;
        right: 150px;
        bottom: 150px;
        width: 120px;
        height: 26px;
        border-radius: 13px;
        background: #e6e9ef;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="glow"></div>
      <div class="mark"><div class="slash"></div></div>
      <div class="caret"></div>
    </div>
  </body>
</html>
